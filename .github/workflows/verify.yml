name: Verify hackathon project

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality + builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: booking_system_frontend/package-lock.json
      - name: Install
        working-directory: booking_system_frontend
        run: npm ci
      - name: Lint
        working-directory: booking_system_frontend
        run: npm run lint
      - name: Test
        working-directory: booking_system_frontend
        run: npm test
      - name: Normal production build
        working-directory: booking_system_frontend
        run: npm run build
      - name: Hackathon Pages build
        working-directory: booking_system_frontend
        env:
          VITE_HACKATHON_DEMO: "true"
          VITE_BASE_PATH: /galaxium-reaper-hackathon/
        run: npm run build

  backend:
    name: Python backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: booking_system_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: booking_system_backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test service layer
        run: python -m pytest -q tests/test_services.py tests/test_booking_confirmation_backend.py
      - name: Note REST compatibility baseline
        run: |
          echo "REST endpoint tests are not blocking this hackathon pipeline."
          echo "Current upstream requirements are unconstrained and the latest fastapi-mcp/mcp combination is incompatible at import time."

  java:
    name: Java hold-service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: booking_system_inventory_hold_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test
        run: mvn -B test

  live-smoke:
    name: Live demo smoke test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [frontend, backend, java]
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Pages deployment window
        run: sleep 20
      - name: Smoke test deployed demo
        run: bash scripts/hackathon/smoke-live.sh
