name: 🤖 Bob Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

jobs:
  review:
    name: Bob reviews selected PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Bob Shell
        run: curl -fsSL https://bob.ibm.com/download/bobshell.sh | bash -s -- --pm npm

      - name: Fetch PR metadata and diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          gh pr view "$PR_NUMBER" --json number,title,state,headRefName,baseRefName,url > pr.json
          gh pr diff "$PR_NUMBER" > pr.diff

      - name: Run Bob Shell review
        env:
          BOBSHELL_API_KEY: ${{ secrets.BOBSHELL_API_KEY }}
        run: |
          cat > prompt.txt << 'PROMPT'
          You are reviewing a pull request on the Galaxium Travels hackathon fork, non-interactively, in CI.
          Bob usage is intentionally budgeted, so be concise and targeted.

          Read AGENTS.md and @pr.diff. Classify the PR as:
          1. Feature / infrastructure change
          2. Demo scenario
          3. Learning assignment

          Only investigate deeper when the diff shows a concrete red flag. If deeper inspection is needed,
          read only the specific file/lines required to confirm or dismiss that issue.

          Output the review to stdout and bracket it exactly:

          <<<BOB_REVIEW_BEGIN>>>
          ...review markdown...
          <<<BOB_REVIEW_END>>>

          Include:
          - 1-2 sentence summary
          - PR category
          - Findings grouped as blocker / nit / question for feature/infrastructure changes
          - exact file path and line when reporting a finding
          - a plain statement when no real issues are found

          Do not modify files. Do not run the test suite. Do not invent findings.
          PROMPT
          bob run --accept-license --trust "$(cat prompt.txt)" 2>&1 | tee bob_output.txt

      - name: Extract review
        run: |
          python3 - << 'PY'
          import re
          text = open('bob_output.txt').read()
          matches = re.findall(r'<<<BOB_REVIEW_BEGIN>>>(.*?)<<<BOB_REVIEW_END>>>', text, re.DOTALL)
          if matches:
              body = matches[-1].strip()
          else:
              body = "_Bob did not produce a structured review._"
          open('review.md', 'w').write(
              "## 🤖 Bob's Review\n\n"
              "*Manual budgeted review via Bob Shell.*\n\n---\n\n"
              + body + "\n"
          )
          PY
          cat review.md

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: gh pr review "$PR_NUMBER" --comment --body-file review.md
